[workspace]
resolver = "3"
members = [
    "common",
    "client",
    "server",
    "slave",
]

[workspace.dependencies]
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
crossbeam-channel = "0.5.15"
rkyv = "0.8.15"
anyhow = "1.0.100"
laminar = "0.5"
tracing-subscriber = "0.3.22"
tracing = "0.1.44"
uuid = "1.21.0"
parking_lot = "0.12.5"



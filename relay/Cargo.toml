[package]
name = "rc-relay"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "slave"
path = "src/slave.rs"

[[bin]]
name = "master"
path = "src/master.rs"

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "inputs"
path = "src/inputs.rs"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
tokio-macros = "2.6.0"
laminar = "0.5"
serde = { version = "1.0.228", features = ["derive"] }
bincode = {version = "2.0.1", features = ["serde"] }
crossbeam-channel = "0.5.15"
pasts = "0.8"
stick = "0.13.0"
bluest = "0.6.9"
anyhow = "1.0.100"
futures-lite = "2.6.1"
bimap = "0.6.3"

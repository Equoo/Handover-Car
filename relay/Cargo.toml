[package]
name = "rc-relay"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "slave"
path = "src/slave.rs"

[[bin]]
name = "master"
path = "src/master.rs"

[[bin]]
name = "server"
path = "src/server.rs"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
tokio-macros = "2.6.0"
laminar = "0.5"
serde = { version = "1.0.228", features = ["derive"] }
bincode = {version = "2.0.1", features = ["serde"] }

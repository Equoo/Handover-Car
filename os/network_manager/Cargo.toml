[package]
name = "network_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
colored = "3.0.0"
crossterm = "0.29.0"
glob = "0.3.3"
ping = "0.7.0"
regex = "1.12.2"
tokio = { version = "1.48.0", features = ["full"]}
tokio-serial = "5.4.5"

[[bin]]
name = "monitor"
path = "src/monitor.rs"

[[bin]]
name = "setup"
path = "src/setup.rs"
